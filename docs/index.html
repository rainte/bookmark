<script type="text/javascript">
  const tree = (data, ele) => {
    data.forEach((item) => {
      if (item.title == '嘿呦') {
        return
      }

      let box
      if (item.children) {
        box = document.createElement('div')
        box.classList.add('mark-box')

        const node = document.createElement('div')
        node.classList.add('mark-node')
        node.textContent = item.title
        box.appendChild(node)

        const text = document.createElement('div')
        text.classList.add('mark-items')
        box.appendChild(text)

        tree(item.children, text)
      } else {
        ele.parentElement.classList.add('mark-row')

        box = document.createElement('a')
        box.classList.add('mark-text')
        box.textContent = item.title
        box.setAttribute('href', item.url)
        box.setAttribute('target', '_blank')
      }

      ele.appendChild(box)
    })
  }
</script>

<script type="text/javascript">
  const filterSensitive = (data, value) => {
    if (Array.isArray(data)) {
      return data
        .map((item) => filterSensitive(item, value))
        .filter((item) => {
          if (item && typeof item === 'object') {
            return item.title !== value
          }
          return true
        })
    }
    if (data && typeof data === 'object') {
      const result = { ...data }
      if (result.children) {
        result.children = filterSensitive(result.children, value)
      }
      return result
    }
    return tree
  }

  fetch('bookmark.json')
    .then((res) => res.json())
    .then((res) => filterSensitive(res, '嘿呦'))
    .then((res) => tree(res, document.getElementsByTagName('section')[0]))
</script>
